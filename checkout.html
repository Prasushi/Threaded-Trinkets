<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Threaded Trinkets</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>

    <header class="site-header">

        <div class="container nav">

            <a href="index.html" class="logo">
                Threaded <span>Trinkets</span>
            </a>

            <a href="cart.html" class="cart-icon">
                🛒 <span id="cartCount">0</span>
            </a>

        </div>

    </header>

    <main>

        <section class="checkout-page">

            <div class="container">

                <h1>Checkout</h1>

                <div id="paymentItems"></div>

                <div class="payment-summary">

                    <p>
                        Subtotal:
                        <span id="paymentSubtotal">₹0</span>
                    </p>

                    <p>
                        Total:
                        <span id="paymentTotal">₹0</span>
                    </p>

                    <h3>
                        UPI Payment
                    </h3>

                    <p>
                        UPI ID:
                        <span id="upiIdDisplay"></span>
                    </p>

                    <div id="upiQRCode"></div>

                    <p id="paymentStatus"></p>

                    <p id="paymentMessage"></p>

                    <a id="openUpiBtn"
                       href="#">
                        Pay with UPI
                    </a>

                    <button id="paymentSuccessBtn"
                            style="display:none;">
                        Payment Successful
                    </button>

                    <button id="confirmOrderBtn"
                            style="display:none;">
                        Confirm Order
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="js/payment.js"></script>

</body>

</html>
